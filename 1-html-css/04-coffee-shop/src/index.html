<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Website</title>
    <link href="style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  </head>
  <body>
    <header>
      <nav class="navbar navbar--content">
        <a href="#" class="navbar__logo">
          <h2 class="logo__text">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="black"><path d="M160-120v-80h640v80H160Zm160-160q-66 0-113-47t-47-113v-400h640q33 0 56.5 23.5T880-760v120q0 33-23.5 56.5T800-560h-80v120q0 66-47 113t-113 47H320Zm0-80h240q33 0 56.5-23.5T640-440v-320H240v320q0 33 23.5 56.5T320-360Zm400-280h80v-120h-80v120ZM320-360h-80 400-320Z"/></svg>
            Coffee
          </h2>
        </a>
        <ul class="navbar__menu">
          <li class="menu__item">
            <a href="#" class="menu__link">Home</a>
          </li>
          <li class="menu__item">
            <a href="#" class="menu__link">About</a>
          </li>
          <li class="menu__item">
            <a href="#" class="menu__link">Menu</a>
          </li>
          <li class="menu__item">
            <a href="#" class="menu__link">Testemonials</a>
          </li>
          <li class="menu__item">
            <a href="#" class="menu__link">Gallery</a>
          </li>
          <li class="menu__item">
            <a href="#" class="menu__link">Contact</a>
          </li>
        </ul>
      </nav>
    </header> 
    <main>
      <section class="hero-section">
        <div class="hero-section__content">
          <div class="hero-section__details">
            <h2 class="hero-section__title">Best Coffee</h2>
            <h3 class="hero-section__subtitle">Start your day with our special coffee!</h3>
            <p class="hero-section__description">
              Welcome to our coffee paradise, where every bean tells a story and every cup sparks joy.
            </p>
            <div class="hero-section__buttons">
              <a href="#" class="button button--order-now">Order Now</a> 
              <a href="#" class="button button--contact-us">Contact Us</a> 
            </div>
          </div> 
          <div class="hero-section__image">
            <img src="../assets/coffee-hero-section.png" alt="Hero" class="hero-section__img" width="400" height="400">
          </div>
        </div> 
      </section>
    </main>
  </body>
</html>
